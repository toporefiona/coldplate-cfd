# Cold plate study settings. All lengths in millimetres.
plate:
  length: 400
  width: 200
  inlet_header: 30
  outlet_header: 30
  port_width: 15
  port_length: 30
  wall: 5
  edge_margin: 10

channels:
  min: 6
  max: 16


mesh:
  cell_size: 1.4        # mm, largest cells (chosen in the Phase 4 mesh study)
  wall_cell_size: 0.7   # mm, cells next to the walls
  wall_zone: 5          # mm, distance over which cells grow from the wall size to cell_size