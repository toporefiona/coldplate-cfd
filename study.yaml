# Cold plate study settings. All lengths in millimetres.
plate:
  length: 400
  width: 200
  inlet_header: 30
  outlet_header: 30
  port_width: 15
  port_length: 30
  wall: 5
  edge_margin: 10

channels:
  min: 6
  max: 16

flow:
  u_min: 0.1   # m/s, slowest inlet velocity in the study
  u_max: 0.3   # m/s, fastest (Re about 1700 in the port, still laminar)


mesh:
  cell_size: 1.4        # mm, largest cells (chosen in the Phase 4 mesh study)
  wall_cell_size: 0.7   # mm, cells next to the walls
  wall_zone: 5          # mm, distance over which cells grow from the wall size to cell_size

physics:
  heat: 200       # W, battery heat into the plate
  depth: 3        # mm, channel depth (sets the depth friction and the heat source)
  inlet_T: 25     # C, coolant inlet temperature