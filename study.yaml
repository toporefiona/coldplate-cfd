# Cold plate study settings. All lengths in millimetres.
plate:
  length: 400
  width: 200
  inlet_header: 30
  outlet_header: 30
  port_width: 15
  port_length: 30
  wall: 5
  edge_margin: 10

channels:
  min: 6
  max: 16


mesh:
  cell_size: 2        # mm, largest cells (middle of channels and headers)
  wall_cell_size: 2   # mm, cells next to the walls (same as cell_size = no refinement)
  wall_zone: 5        # mm, distance over which cells grow from the wall size to cell_size